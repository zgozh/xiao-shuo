name: Zheyou Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          printf 'Using preinstalled Android SDK: %s\n' "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleAppDebug :app:testAppDebugUnitTest --tests '*JapaneseSourceRuleTest' --tests '*Discovery*Test' --tests '*SearchResultMergerTest' --tests '*SearchResultDiffCallbackTest' --tests '*ContentQualityTest' --tests '*SourceRepositoryTest' --tests '*SourceRecommendationTest' --tests '*ReaderPresetsTest' --tests '*SearchProgressReporterTest' --tests '*SearchPaginationContractTest' --tests '*SearchCommandGateTest' --tests '*ReadStyleLineSpacingTest' --tests '*ChangeSource*Test' --tests '*SourceNavigationPolicyTest'
      - uses: actions/upload-artifact@v4
        with:
          name: zheyou-debug
          path: app/build/outputs/apk/app/debug/*.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          printf 'Using preinstalled Android SDK: %s\n' "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ../signing/zheyou.p12
        run: |
          test -n "$RELEASE_KEY_STORE" || { echo 'Configure release signing secrets first'; exit 1; }
          mkdir -p signing
          printf '%s' "$RELEASE_KEY_STORE" | base64 --decode > signing/zheyou.p12
          export RELEASE_KEY_ALIAS="$(keytool -list -keystore signing/zheyou.p12 -storepass:env RELEASE_STORE_PASSWORD -J-Duser.language=en | awk -F, '/PrivateKeyEntry/ {print $1; exit}')"
          test -n "$RELEASE_KEY_ALIAS" || { echo 'No private signing key found'; exit 1; }
          chmod +x gradlew
          ./gradlew :app:assembleAppRelease
          mkdir -p artifacts
          cp app/build/outputs/apk/app/release/*.apk "artifacts/zheyou_${GITHUB_REF_NAME#v}.apk"
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish APK and source reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "柘栯小说 $GITHUB_REF_NAME" --generate-notes --latest
  publish-packaged-apk:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Establish initial repository baseline
        if: "github.event.head_commit.message == 'Initial commit: Zheyou Novel'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.6" -f sha="$GITHUB_SHA" -F force=true
          for tag in v1.0.0 v1.0.2 v1.0.4 v1.0.5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes
            fi
          done
      - name: Verify and publish locally signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f downloads/zheyou_1.0.6.apk
          (cd downloads && sha256sum -c SHA256SUMS.txt)
          if gh release view v1.0.6 >/dev/null 2>&1; then
            gh release upload v1.0.6 downloads/zheyou_1.0.6.apk downloads/SHA256SUMS.txt --clobber
            gh release edit v1.0.6 --target "$GITHUB_SHA" --title '柘栯小说 1.0.6' --notes-file docs/RELEASE-1.0.6.md --latest
          else
            gh release create v1.0.6 downloads/zheyou_1.0.6.apk downloads/SHA256SUMS.txt --target "$GITHUB_SHA" --title '柘栯小说 1.0.6' --notes-file docs/RELEASE-1.0.6.md --latest
          fi
