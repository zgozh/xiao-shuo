name: Goubin Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleAppDebug :app:testAppDebugUnitTest --tests '*ContentQualityTest' --tests '*SourceRepositoryTest' --tests '*SourceRecommendationTest' --tests '*ReaderPresetsTest' --tests '*SearchProgressReporterTest' --tests '*SearchPaginationContractTest' --tests '*SearchCommandGateTest' --tests '*ReadStyleLineSpacingTest' --tests '*ChangeSource*Test' --tests '*SourceNavigationPolicyTest'
      - uses: actions/upload-artifact@v4
        with:
          name: goubin-debug
          path: app/build/outputs/apk/app/debug/*.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed APK
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: goubin
          RELEASE_STORE_FILE: ../signing/goubin.p12
        run: |
          test -n "$RELEASE_KEY_STORE" || { echo 'Configure release signing secrets first'; exit 1; }
          mkdir -p signing
          printf '%s' "$RELEASE_KEY_STORE" | base64 --decode > signing/goubin.p12
          chmod +x gradlew
          ./gradlew :app:assembleAppRelease
          mkdir -p artifacts
          cp app/build/outputs/apk/app/release/*.apk "artifacts/goubin_${GITHUB_REF_NAME#v}.apk"
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish APK and source reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "勾彬小说 $GITHUB_REF_NAME" --generate-notes
  publish-packaged-apk:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish locally signed first release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f downloads/goubin_1.0.0.apk || exit 0
          (cd downloads && sha256sum -c SHA256SUMS.txt)
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Version 1.0.0 already published; existing assets retained.'
            exit 0
          fi
          gh release create v1.0.0 downloads/goubin_1.0.0.apk downloads/SHA256SUMS.txt --target "$GITHUB_SHA" --title '勾彬小说 1.0.0' --notes-file docs/RELEASE-1.0.0.md
